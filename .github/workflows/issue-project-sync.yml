name: 大盘同步

# org issue / PR ↔ GitHub Projects 大盘自动对齐。
# Projects v2 不会自动纳入跨仓 issue/PR，也不会跟进 tag——定时补齐。
# 事件触发只覆盖本仓（oagentkit/.github），跨仓靠下面的轮询。
#
# 失败语义：脚本内部任何一步读不到（token 无 project 权限 / 看板读不到 /
# 某仓读不到 / 同步后审计缺条目）都非零退出，本 workflow 直接红掉，
# 绝不出现「N/M 仓被跳过、报告仍显示通过」。

on:
  schedule:
    # 每小时一次（避开整点，降压）
    # 用 :23 而不是 :17——oekit 的同款轮询在 :17，两边错开。
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      simulate-no-pat:
        description: '模拟「拿不到 PAT」的事件上下文（Dependabot / fork PR）：自测回落内置只读 token、看板同步步跳过。用来主动验证降级路径，而不是等下一个 Dependabot PR 才被动发现。'
        type: boolean
        default: false
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-project-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 「有没有 PAT 可用」的唯一判据（工作流里只有这一处决定）。
      #
      #   正常事件（schedule / issues / pull_request）⇒ PAT 在则 'true'。
      #   pull_request 且由 Dependabot / fork 触发 ⇒ GitHub **不提供 secrets**
      #     ⇒ PAT 为空 ⇒ 'false'（实测 issue #29：run 40050342344 因 GH_TOKEN
      #     为空而红，日志里 `env:` 段是空的 `GH_TOKEN:`）。
      #   手动触发且 simulate-no-pat=true ⇒ 强制 'false'，用来**主动验证降级路径**
      #     （否则这条路径只能等下一个 Dependabot PR 才被动发现）。
      #
      # ⚠️ 两处刻意的写法，踩了就静默走错分支：
      #   1) 判据走 job 级 env：step 级 `if` 的可用上下文里**没有 secrets**（有 env）
      #      ⇒ 不能写 `if: secrets.X != ''`。
      #   2) 下游一律用**字符串比较** `== 'true'`，不用裸布尔：env 的值在表达式里
      #      是字符串，裸真值判定对 'false' 字符串不可靠（'false' 非空 ⇒ 真）。
      #
      # PAT 本体**不**放 job 级 env —— 那会让它出现在 checkout 等无关步骤的环境里。
      USE_PAT: ${{ secrets.OAGENTKIT_PROJECT_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs['simulate-no-pat'] != true) }}
    steps:
      - uses: actions/checkout@v7

      - name: Selftest (manifest API path)
        # 自测必须先跑：模块清单的 **API 路径** 在本地有文件时永远走不到，
        # 只有 CI 才执行得到。实测（2026-10-20）就栽在这——API 分支用 JSON
        # 解析器去解析裸 base64 输出，本地全绿、CI 必红，且报错指不到真正原因。
        # 凡是「本地短路、只有 CI 才走到」的分支，都要有自测覆盖。
        #
        # 凭据：自测是**只读**的——读一个公开仓的 modules.json
        # （scripts/sync-projects.py 的 selftest()：gh api 取 base64 → 解码 → 校验 JSON），
        # **不需要 project scope** ⇒ 内置 github.token（只读）就够。
        # 「内置 token 能读 matrix-tools」在本仓已有既证：repo-ci.yml 就是用
        # 默认 github.token（没传 token）checkout matrix-tools 与站点仓的。
        #
        # PAT 在时用 PAT（保持原状），不在时回落到内置 token ⇒ Dependabot / fork PR
        # 不再恒红。改的是**凭据来源**，不是**被测路径**：API 路径照走、照测。
        env:
          GH_TOKEN: ${{ env.USE_PAT == 'true' && secrets.OAGENTKIT_PROJECT_TOKEN || github.token }}
        run: python3 scripts/sync-projects.py --selftest

      - name: Sync org board
        # 看板读写需要 project（读写）scope ⇒ 必须用 PAT。
        # 所需权限：project（读写）+ read:org + repo
        #
        # 拿不到 PAT 时**跳过并说明**，而不是红：
        # 这里不是「读了但读不到」，而是「此事件上下文**根本没有凭据**」——
        # 同步操作在这里不存在。覆盖不会丢：每小时 23 * * * * 的 cron 会做真正的对账，
        # PR 事件上的这一跳只是「顺带提前一次」。
        # 跳过时下面的 notice 步骤会在 run 里留痕，不是悄悄变绿。
        if: env.USE_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.OAGENTKIT_PROJECT_TOKEN }}
          ORG: oagentkit
          PROJECT: '1'
        run: |
          set -euo pipefail
          python3 scripts/sync-projects.py --apply

      - name: Notice (board sync skipped)
        # 不让「跳过」变成无声无息：留一条注解，说明为什么没同步、谁会补上。
        if: env.USE_PAT != 'true'
        run: |
          echo "::notice title=大盘同步已跳过::本事件上下文没有可用的 OAGENTKIT_PROJECT_TOKEN（Dependabot / fork PR 不提供 secrets）⇒ 看板同步已跳过；每小时 23 * * * * 的 cron 会做真正的对账。清单 API 路径的自测已在上一步用内置 token 跑过。"
