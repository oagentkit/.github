name: Repo CI

# 本仓（规则本体）的持续集成：脚本可执行性 + YAML 语法。
# go-ci.yml 是下发给模块仓的 Go 门禁；这里管的是规则仓自己的壳。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每日跨仓漂移审计（issue matrix-tools#76）。
    #
    # 为什么本仓需要定时跑：本仓的 job 大多是**跨仓**的（矩阵漂移、门面守卫、
    # 幽灵包、CHANGELOG 覆盖……）——别的仓有欠账 ⇒ 本仓的 run 变红。
    # 欠账修好后，**本仓若没被再次 push**，「main 最新一次 run」仍是修债前那次
    # 红的 run ⇒ 徽章**长期挂假红**且没有任何门禁会报它（实测：8 个模块仓的
    # main 徽章假红挂了约 13 小时）。
    # 定时跑 = 判据按当前远端状态**重算** ⇒ 徽章每天自愈一次。
    #
    # 错开 matrix-tools 的 '17 6 * * *'（那是全矩阵 CHANGELOG 覆盖的硬失败归属地）。
    - cron: '29 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::py_compile ${f}"
            if ! python3 -m py_compile "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.py' | sort)
          exit "$fail"

      - name: Shell syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::bash -n ${f}"
            if ! bash -n "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.sh' | sort)
          exit "$fail"

      - name: 看板读的取数失败自测（离线）
        # 看板读会**间歇性**返回被截断/空的结果（issue .github#22）⇒
        # 「读到空」不能当成「板上就是空的」。这条自测用**假 gh** 确定性地
        # 复刻那几种读坏掉的形态，断言脚本报的是「取数失败」而不是「缺 N 条」。
        # 纯离线：不联网、不需要 token ⇒ 可以在任何 CI 里跑。
        run: python3 scripts/sync-projects.py --selftest-board

      - name: 脚本 --help 冒烟
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::bash ${f} --help"
            if ! bash "$f" --help >/dev/null 2>&1; then
              # 部分脚本无 usage 分支，只要求能被 bash 解析并以 0/1/2 退出
              bash -n "$f"
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.sh' | sort)
          exit "$fail"

  matrix-docs:
    name: Matrix docs drift
    # 防的是「已退役结论被重新生成回文档」：matrix-tools/modules.json 是单一数据源，
    # oagentkit.github.io 的 llms.txt 是它的生成物。两者漂移时 AI Agent 会读到失效结论。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        # 门面符号级门禁的提取器是 go/parser 程序（matrix-tools/scripts/symdump），
        # 只用标准库，但要有 go 工具链。版本与全矩阵一致（CI go-version 1.26）。
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # 两个外部仓都不指定 ref：checkout 默认取各自默认分支（main）。
      # 显式写 ref: '' 是无效值会让 checkout 报错；显式写死 main 则在
      # 「matrix-tools 自己开 PR」时验不到那个 PR 的内容。
      - name: Checkout matrix-tools
        uses: actions/checkout@v7
        with:
          repository: oagentkit/matrix-tools
          path: matrix-tools

      - name: Checkout docs site
        uses: actions/checkout@v7
        with:
          repository: oagentkit/oagentkit.github.io
          path: site

      - name: llms.txt 与 modules.json 一致
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_docs.py \
            --matrix matrix-tools/modules.json \
            --llms site/docs/public/llms.txt

      - name: profile 分层表与 modules.json 一致
        # profile 是 org 的门面页（人类与 AI Agent 的第一入口），
        # 它给出的分层必须与单一数据源一致。
        # 实测 2026-10-21：profile 的 tier 表曾在 5 个仓上与 modules.json 冲突
        # （queue 被写在 tier0、实为 tier2；obs/skillkit/mcpkit/rag 被写在 tier1、实为 tier2），
        # 而当时**没有任何门禁会报出来**——CI 全绿，门面页给的是错的分层。
        #
        # 判据是「逐项一致」：按 tier 比对仓的集合（双向，缺一多一都判红），
        # 不比文案；profile 的 tier 表必须落在生成区标记之间（标记被删 = 判红）。
        # 修法是改 matrix-tools/modules.json（数据源说了算），再跑
        # `python3 scripts/verify_profile_tiers.py --write` 重生成。
        run: |
          set -euo pipefail
          python3 scripts/verify_profile_tiers.py \
            --matrix matrix-tools/modules.json \
            --profile profile/README.md

      - name: 站点 versions.json 是 matrix-tools 的逐字节副本
        # 上一步查的是「生成物 vs 数据源」。这一步查的是「副本 vs 原件」——
        # 站点 docs/public/versions.json 是 matrix-tools/versions.json 的拷贝，
        # 此前没有任何检查比对两者，「改了这边忘了那边」在 CI 里是全绿的。
        # llms.txt 有 verify_docs.py 守着，versions.json 曾是同一个漂移缺口。
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_versions_drift.py \
            --matrix matrix-tools/modules.json \
            --versions matrix-tools/versions.json \
            --compare site/docs/public/versions.json

      - name: 门面仓守卫自测
        # 守卫脚本最危险的失效模式是「一直绿，但从没生效过」——
        # 豁免名单写错一个字符，它就会静默放过所有违规。所以必须证明它还活着。
        run: python3 matrix-tools/scripts/check_facade_imports.py --selftest

      - name: Checkout 矩阵各仓（供门面仓扫描）
        run: |
          set -euo pipefail
          mkdir -p matrix
          while IFS= read -r repo; do
            [ "$repo" = "matrix-tools" ] && continue
            [ "$repo" = "oagentkit.github.io" ] && continue
            [ "$repo" = ".github" ] && continue
            echo "::group::checkout $repo"
            git clone -q --depth 1 "https://github.com/oagentkit/${repo}.git" "matrix/$repo"
            echo "::endgroup::"
          done < <(python3 -c "
          import json, pathlib
          d = json.loads(pathlib.Path('matrix-tools/modules.json').read_text())
          print('\n'.join(m['repo'] for m in d['modules']))
          ")

      - name: 扫描矩阵各仓是否仍引门面仓/旧单仓
        # 门面仓 agentkit 计划 v1.x 后 archive。现在只有文档约束，
        # 半年后有人写一个新 import 不会有人收到通知 —— 这条把它变成红灯。
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/check_facade_imports.py --roots matrix

      - name: 扫描文档里的陈旧包引用
        # 防的是「看起来合法但已经错了」的结论。runtime/breaker 退役后，
        # textx/AGENTS.md 仍把熔断归给 runtime/breaker —— 照着 import 会
        # module not found，而人工 review 恰恰最容易漏这类（仓还在，只是包没了）。
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/scan_stale_refs.py \
            --matrix matrix-tools/modules.json \
            --root . --verbose

      - name: 检测幽灵包（仓里有、矩阵未登记）
        # guardx/injectband 提交时带了代码 + 测试 + README，CI 全绿，
        # 但没进 modules.json —— 于是它成了矩阵外的存在：消费方在
        # versions.json / llms.txt 里看不到它，分层与依赖闭包门禁对它完全失效。
        # **CI 绿不代表矩阵完整。**
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_ghost_packages.py \
            --matrix matrix-tools/modules.json \
            --root . --repos-dir matrix --verbose

      - name: Checkout 门面仓（供 re-export 覆盖校验）
        # 门面仓不在 modules.json 里（它不是矩阵模块，是兼容层），
        # 所以上面那个 clone 循环不会带上它，得单独 checkout。
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://github.com/oagentkit/agentkit.git" "matrix/agentkit"

      - name: 各仓 CHANGELOG 未过期（PR 范围裁剪）
        # CONTRIBUTING 要求各仓 CHANGELOG.md 在场且不过期。此前 13 个仓一个都没有，
        # 现在由 matrix-tools/scripts/gen_changelogs.py 从 git 历史生成并守住一致性。
        #
        # 两道门禁，关注点分离（issue matrix-tools#41）：
        #   ① 独立 oracle：直接扫**原始 git 历史**算「应当出现的条目与正文」，
        #      与提交版比对——**不复用生成器的解析函数**，否则生成器丢 body 时
        #      门禁跟着一起丢（实测 7 仓 773 处正文缺失，逐字节门禁一条没报出来）；
        #   ② 生成器侧：提交版是否覆盖生成器的产出（且相对顺序未被打乱）。
        #
        # ⚠️ 范围按「**谁造成漂移谁负责**」裁剪（issue #41 裁决 2）：
        #   PR 事件 → 只校验**本 PR 触及的仓**，且用 **PR head** 的内容校验
        #             （只裁剪不换 ref 解决不了问题——合入前各仓 main 上还是旧产物）；
        #   非 PR 事件（push / 定时 / 手动）→ 全矩阵（**周期性全量审计兜底**，不可省，
        #             否则是漏检）。
        #   改造前每个 PR 都全 org 扫 14 个仓 ⇒ 任一模块欠账堵住所有无关 PR
        #   （实测 oagentkit/.github#15 被卡两天）。
        #
        # ⚠️ 本仓是**跨仓审计的归属方**（不是被审计方）：本仓不在「有 CHANGELOG
        # 要求的仓」清单里 ⇒ PR 事件下范围为空（不校验任何仓），push / 定时事件下
        # 走全矩阵并**硬失败**——这正是「跨仓欠账唯一的硬失败归属地」在治理仓这一侧
        # 的落法。模块仓那一侧的口径由 go-ci.yml 的 input `changelog-scope` 决定
        # （issue matrix-tools#76：默认仍是全矩阵＝旧行为，换口径要先单仓试点）。
        #
        # 范围判定的**唯一逻辑来源**是 oracle 的 --print-scope（它读 GitHub 事件上下文）：
        # 两条门禁共用同一份判定，别在这个 YAML 里另造一份。
        #
        # ⚠️ 克隆必须**完整**（浅克隆没有 tag，生成器会拿 0 个版本段去比对，
        # 报出「已过期」的假红）。脚本内部自己完整克隆，不需要这里的 clone 循环。
        run: |
          set -euo pipefail
          # ① 独立 oracle（自带克隆 + fetch PR head）
          python3 matrix-tools/scripts/verify_changelog_coverage.py \
            --ci --org oagentkit --clone-dir matrix-coverage

          # ② 生成器侧判据——复用 ① 已克隆好的仓（同一批 clone，含 PR head checkout）
          #    这里只要仓名：ref 由 ① 的克隆负责（同一个 clone-dir，已 checkout 到
          #    PR head），用 cut -f1 取掉第二列，免得留个没人用的变量。
          fail=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            python3 matrix-tools/scripts/gen_changelogs.py \
              --root matrix-coverage --repo "$repo" --check || fail=1
          done < <(python3 matrix-tools/scripts/verify_changelog_coverage.py \
                     --ci --print-scope | cut -f1)
          exit "$fail"

      - name: 门面仓 re-export 覆盖完整性
        # 防的是「矩阵新增了一个包，门面没跟上」——实测 2026-10-19：
        # 矩阵已 47 个包，门面只有 45 个，缺 toolgate/invoke 与 guardx/injectband。
        # 后果不是编译失败，而是走门面的下游**根本够不到这两个包**：
        # go get github.com/oagentkit/agentkit/invoke 直接 404。
        #
        # 与 verify_ghost_packages 是**反方向**的缺口：
        #   ghost：仓里有、矩阵没登记 → 矩阵外的幽灵包
        #   本条：矩阵里有、门面没转发 → 门面上的覆盖空洞
        # 两者都缺，就是「矩阵不完整」在门面侧的表现。
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_facade_packages.py \
            --matrix matrix-tools/modules.json \
            --facade matrix/agentkit

      - name: 门面仓符号级转发完整性
        # 上一条查的是**包**的覆盖，这条查的是**包内符号**的覆盖——
        # 两者是不同的洞：包齐全 ≠ 符号齐全。
        #
        # 实测 2026-10-20：47 个门面包里有 3 个包漏转发 23 个上游导出符号
        # （textutil 11 / logredact 11 / policy 1），另有 131 处上游 const
        # 被门面转发成 var。后果是下游按门面 import 直接编译失败
        # （undefined: textutil.Tokens 等），而三条既有门面守卫全绿。
        #
        # 判据是**独立 oracle**：go/parser 直接解析上游源码与门面 alias.go
        # 求差集，不比对任何生成物。规则本体在 matrix-tools/scripts/。
        #
        # ⚠️ 顺序依赖：本 job 拉的是 matrix-tools 的 **main**，
        # 所以这条门禁必须先在 matrix-tools 仓合入，本 PR 才可能变绿。
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_facade_symbols.py \
            --root matrix \
            --facade matrix/agentkit

      - name: 门面仓发布地板守卫自测
        # 同 check_facade_imports：必须证明这条守卫还活着。
        # 判据里特意放了「门面接 v0.1.0」这个样本 —— 那是线上真实发生过的形态。
        run: python3 matrix-tools/scripts/verify_facade_release.py --selftest

      - name: 门面 re-export 覆盖守卫自测
        run: python3 matrix-tools/scripts/verify_facade_packages.py --selftest

      - name: 门面仓已发布 tag 的依赖地板
        # 防的是「main 修好了、tag 没修」这类只有发版才暴露的缺陷。
        # Go 的 MVS 只看被消费版本的 go.mod：门面仓 agentkit 若发 tag 时
        # go.mod 还钉着 v0.1.0，消费方 go get 门面仓会静默拿到拆分初期的
        # 13 个模块实现 —— 不报错、不告警、go build 照样过。
        # 所以这里查的是**线上 tag**，不是 main。
        #
        # 基座 org（github.com/oekit/*）的依赖同样参与 MVS，一并查——
        # 矩阵 13 个仓全绿但基座落后，是「半个 MVS 没查」，消费方照样拿不到新实现。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_facade_release.py --org oagentkit

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: YAML parse (workflows + templates + dependabot)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pyyaml'])
              import yaml

          roots = [
              Path('.github/workflows'),
              Path('.github'),
              Path('workflow-templates'),
              Path('templates'),
          ]
          patterns = ('*.yml', '*.yaml')
          files = []
          for r in roots:
              if not r.exists():
                  continue
              for p in patterns:
                  files.extend(r.rglob(p))
          files = sorted(set(files))
          if not files:
              print('no yaml files found')
              sys.exit(1)

          failed = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(f.read_text(encoding='utf-8')))
                  print(f'OK   {f}')
              except Exception as e:
                  print(f'FAIL {f}: {e}')
                  failed = 1
          sys.exit(failed)
          PY
