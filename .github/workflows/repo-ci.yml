name: Repo CI

# 本仓（规则本体）的持续集成：脚本可执行性 + YAML 语法。
# go-ci.yml 是下发给模块仓的 Go 门禁；这里管的是规则仓自己的壳。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::py_compile ${f}"
            if ! python3 -m py_compile "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.py' | sort)
          exit "$fail"

      - name: Shell syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::bash -n ${f}"
            if ! bash -n "$f"; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.sh' | sort)
          exit "$fail"

      - name: 脚本 --help 冒烟
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::bash ${f} --help"
            if ! bash "$f" --help >/dev/null 2>&1; then
              # 部分脚本无 usage 分支，只要求能被 bash 解析并以 0/1/2 退出
              bash -n "$f"
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.sh' | sort)
          exit "$fail"

  matrix-docs:
    name: Matrix docs drift
    # 防的是「已退役结论被重新生成回文档」：matrix-tools/modules.json 是单一数据源，
    # oagentkit.github.io 的 llms.txt 是它的生成物。两者漂移时 AI Agent 会读到失效结论。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 两个外部仓都不指定 ref：checkout 默认取各自默认分支（main）。
      # 显式写 ref: '' 是无效值会让 checkout 报错；显式写死 main 则在
      # 「matrix-tools 自己开 PR」时验不到那个 PR 的内容。
      - name: Checkout matrix-tools
        uses: actions/checkout@v7
        with:
          repository: oagentkit/matrix-tools
          path: matrix-tools

      - name: Checkout docs site
        uses: actions/checkout@v7
        with:
          repository: oagentkit/oagentkit.github.io
          path: site

      - name: llms.txt 与 modules.json 一致
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_docs.py \
            --matrix matrix-tools/modules.json \
            --llms site/docs/public/llms.txt

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: YAML parse (workflows + templates + dependabot)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pyyaml'])
              import yaml

          roots = [
              Path('.github/workflows'),
              Path('.github'),
              Path('workflow-templates'),
              Path('templates'),
          ]
          patterns = ('*.yml', '*.yaml')
          files = []
          for r in roots:
              if not r.exists():
                  continue
              for p in patterns:
                  files.extend(r.rglob(p))
          files = sorted(set(files))
          if not files:
              print('no yaml files found')
              sys.exit(1)

          failed = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(f.read_text(encoding='utf-8')))
                  print(f'OK   {f}')
              except Exception as e:
                  print(f'FAIL {f}: {e}')
                  failed = 1
          sys.exit(failed)
          PY
